name: Auto Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (optional, auto-generated when empty)"
        required: false
        type: string

permissions:
  contents: write

env:
  GO_VERSION: "1.24.5"
  APP_NAME: DDBOT-Nexus

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    outputs:
      commit_sha: ${{ steps.meta.outputs.commit_sha }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_name: ${{ steps.meta.outputs.release_name }}
    steps:
      - name: Compute metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          EVENT_NAME="${{ github.event_name }}"
          if [ "${EVENT_NAME}" = "workflow_run" ]; then
            COMMIT_SHA="${{ github.event.workflow_run.head_sha }}"
            BRANCH="${{ github.event.workflow_run.head_branch }}"
          else
            COMMIT_SHA="${GITHUB_SHA}"
            BRANCH="${GITHUB_REF_NAME}"
          fi

          SHORT_SHA="${COMMIT_SHA::7}"
          TIME_UTC="$(date -u +'%Y%m%d-%H%M%S')"
          INPUT_TAG="${{ github.event.inputs.tag || '' }}"
          if [ -n "${INPUT_TAG}" ]; then
            RELEASE_TAG="${INPUT_TAG}"
          else
            RELEASE_TAG="auto-${BRANCH}-${TIME_UTC}-${SHORT_SHA}"
          fi

          RELEASE_NAME="DDBOT Nexus ${BRANCH} ${SHORT_SHA}"

          echo "commit_sha=${COMMIT_SHA}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "release_name=${RELEASE_NAME}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build (${{ matrix.goos }}-${{ matrix.goarch }})
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows, darwin]
        goarch: ["386", amd64, arm, arm64]
        exclude:
          - goos: darwin
            goarch: "386"
          - goos: darwin
            goarch: arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            go.sum
            **/go.sum

      - name: Build and package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TIME="$(date --iso-8601=seconds)"
          TAGS="${{ needs.prepare.outputs.release_tag }}"
          COMMIT_SHA="${{ needs.prepare.outputs.commit_sha }}"

          LSP_PKG="$(go list -f '{{.ImportPath}}' ./lsp)"
          CMD_PKG="$(go list -f '{{.ImportPath}}' ./cmd)"

          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then
            EXT=".exe"
          fi

          PKG_DIR="${APP_NAME}-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p "build/${PKG_DIR}"

          GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.goarch }}" \
            go build -trimpath \
            -ldflags "-w -s -X ${LSP_PKG}.BuildTime=${BUILD_TIME} -X ${LSP_PKG}.CommitId=${COMMIT_SHA} -X ${LSP_PKG}.Tags=${TAGS}" \
            -o "build/${PKG_DIR}/${APP_NAME}${EXT}" \
            "${CMD_PKG}"

          cp README.md INSTALL.md LICENSE "build/${PKG_DIR}/"

          if [ "${{ matrix.goos }}" = "windows" ]; then
            (cd build && zip -r "${PKG_DIR}.zip" "${PKG_DIR}" >/dev/null)
            ASSET="build/${PKG_DIR}.zip"
          else
            tar -C build -czf "build/${PKG_DIR}.tar.gz" "${PKG_DIR}"
            ASSET="build/${PKG_DIR}.tar.gz"
          fi

          sha256sum "${ASSET}" > "${ASSET}.sha256"
          echo "asset=${ASSET}" >> "${GITHUB_OUTPUT}"
          echo "checksum=${ASSET}.sha256" >> "${GITHUB_OUTPUT}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release_${{ matrix.goos }}_${{ matrix.goarch }}
          path: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.package.outputs.checksum }}

  publish:
    name: Publish GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release_*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          target_commitish: ${{ needs.prepare.outputs.commit_sha }}
          name: ${{ needs.prepare.outputs.release_name }}
          generate_release_notes: true
          files: |
            release-assets/*
