name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  GO_VERSION: "1.24.5"
  APP_NAME: DDBOT-Nexus

jobs:
  build-release:
    name: Release (${{ matrix.goos }}-${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows, darwin]
        goarch: ["386", amd64, arm, arm64]
        exclude:
          - goos: darwin
            goarch: "386"
          - goos: darwin
            goarch: arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            go.sum
            **/go.sum

      - name: Build and package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TIME="$(date --iso-8601=seconds)"
          TAGS="${GITHUB_REF_NAME:-snapshot}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAGS="snapshot-${GITHUB_SHA::7}"
          fi

          LSP_PKG="$(go list -f '{{.ImportPath}}' ./lsp)"
          CMD_PKG="$(go list -f '{{.ImportPath}}' ./cmd)"

          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then
            EXT=".exe"
          fi

          PKG_DIR="${APP_NAME}-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p "build/${PKG_DIR}"

          GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.goarch }}" \
            go build -trimpath \
            -ldflags "-w -s -X ${LSP_PKG}.BuildTime=${BUILD_TIME} -X ${LSP_PKG}.CommitId=${GITHUB_SHA} -X ${LSP_PKG}.Tags=${TAGS}" \
            -o "build/${PKG_DIR}/${APP_NAME}${EXT}" \
            "${CMD_PKG}"

          cp README.md INSTALL.md LICENSE "build/${PKG_DIR}/"

          if [ "${{ matrix.goos }}" = "windows" ]; then
            (cd build && zip -r "${PKG_DIR}.zip" "${PKG_DIR}" >/dev/null)
            ASSET="build/${PKG_DIR}.zip"
          else
            tar -C build -czf "build/${PKG_DIR}.tar.gz" "${PKG_DIR}"
            ASSET="build/${PKG_DIR}.tar.gz"
          fi

          sha256sum "${ASSET}" > "${ASSET}.sha256"
          echo "asset=${ASSET}" >> "${GITHUB_OUTPUT}"
          echo "checksum=${ASSET}.sha256" >> "${GITHUB_OUTPUT}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release_${{ matrix.goos }}_${{ matrix.goarch }}
          path: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.package.outputs.checksum }}

      - name: Upload assets to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.package.outputs.checksum }}
