name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.24.5"
  APP_NAME: DDBOT-Nexus

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            go.sum
            **/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Compile all packages
        run: go test ./... -run '^$' -count=1

      - name: Go vet
        run: go vet ./...

  test:
    name: Stable Tests
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            go.sum
            **/go.sum

      - name: Run stable test suites
        run: go test ./lsp/groupux ./lsp/roblox -count=1

      - name: Run bot config tests (submodule)
        working-directory: bot
        run: |
          go mod edit -replace github.com/cnxysoft/DDBOT-WSa=..
          go test ./config -count=1

  build:
    name: Build (${{ matrix.goos }}-${{ matrix.goarch }})
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows, darwin]
        goarch: ["386", amd64, arm, arm64]
        exclude:
          - goos: darwin
            goarch: "386"
          - goos: darwin
            goarch: arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            go.sum
            **/go.sum

      - name: Build binary
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TIME="$(date --iso-8601=seconds)"
          TAGS="${GITHUB_REF_NAME:-dev}"
          LSP_PKG="$(go list -f '{{.ImportPath}}' ./lsp)"
          CMD_PKG="$(go list -f '{{.ImportPath}}' ./cmd)"
          OUT_DIR="dist/${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p "${OUT_DIR}"

          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then
            EXT=".exe"
          fi

          OUT_BIN="${OUT_DIR}/${APP_NAME}${EXT}"
          GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.goarch }}" \
            go build -trimpath \
            -ldflags "-w -s -X ${LSP_PKG}.BuildTime=${BUILD_TIME} -X ${LSP_PKG}.CommitId=${GITHUB_SHA} -X ${LSP_PKG}.Tags=${TAGS}" \
            -o "${OUT_BIN}" \
            "${CMD_PKG}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/${{ matrix.goos }}-${{ matrix.goarch }}/*
